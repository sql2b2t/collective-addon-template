plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.18.4'
    id 'java'
}

version = "1.0.0"
group = "com.example.addon"
base { archivesName = "collective-example-addon" }

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.11"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:0.19.5"

    // API клиента. Собери клиент (./gradlew build в репозитории клиента)
    // и скопируй build/devlibs/collective-*-dev.jar в libs/collective-dev.jar
    compileOnly files("libs/collective-dev.jar")
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs += ['-proc:none']
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
